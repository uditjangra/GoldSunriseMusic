<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little Songbook</title>
<meta name="theme-color" content="#fff3ef">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🎀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="is-paused">
  <div class="sparkles" aria-hidden="true"></div>
  <main id="app"><div class="loading">tuning the strings…</div></main>

  <div id="player" class="player" hidden>
    <button class="p-art" id="p-art" title="Open album"></button>
    <div class="p-info">
      <div class="p-title" id="p-title"></div>
      <div class="p-sub" id="p-sub"></div>
    </div>
    <div class="p-controls">
      <button class="p-btn" id="p-repeat" title="Repeat"></button>
      <button class="p-btn" id="p-prev" title="Previous"></button>
      <button class="p-btn p-play" id="p-play" title="Play / pause"></button>
      <button class="p-btn" id="p-next" title="Next"></button>
      <button class="p-btn p-heart" id="p-heart" title="Favorite"></button>
    </div>
    <div class="p-seek">
      <span id="p-cur">0:00</span>
      <input type="range" id="p-range" min="0" max="1000" value="0" aria-label="Seek">
      <span id="p-dur">0:00</span>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
